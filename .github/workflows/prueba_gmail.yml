
name: Prueba de envio Gmail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Enviar correo de prueba
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          user = os.environ["GMAIL_USER"]
          recipient = os.environ["GMAIL_TO"]
          password = os.environ["GMAIL_APP_PASSWORD"]

          if not all((user, recipient, password)):
              raise ValueError("Faltan secretos de Gmail")

          msg = EmailMessage()
          msg["From"] = user
          msg["To"] = recipient
          msg["Subject"] = "Educamos - Prueba GitHub"
          msg.set_content(
              "Esta es una prueba de envio desde GitHub Actions."
          )

          context = ssl.create_default_context()

          with smtplib.SMTP_SSL(
              "smtp.gmail.com", 465,
              context=context, timeout=20
          ) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)

          print("Correo de prueba enviado a Gmail.")
          PY
